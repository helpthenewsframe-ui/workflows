name: Build Android APK
on:
  repository_dispatch:
    types: [build-apk]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject User Configurations
      run: |
        # App Name badalna strings.xml mein
        sed -i "s/WebToAPKApp/${{ github.event.client_payload.name }}/g" app/src/main/res/values/strings.xml
        
        # URL badalna MainActivity.java mein
        sed -i "s|HTTPS_TARGET_URL_PLACEHOLDER|${{ github.event.client_payload.url }}|g" app/src/main/java/com/example/webviewapp/MainActivity.java
        
        # Logos replace karna (Agar user ne logo upload kiya hai)
        echo "${{ github.event.client_payload.logo }}" | base64 -d > app/src/main/res/mipmap-xxhdpi/ic_launcher.png
        echo "${{ github.event.client_payload.splash }}" | base64 -d > app/src/main/res/drawable/splash_logo.png

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Create Release and Upload APK
      uses: softprops/action-gh-release@v2
      with:
        tag_name: apk-v${{ github.run_number }}
        name: Release v${{ github.run_number }}
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
